name: Build_With_Full_Log_DUMP
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.7 official
        run: |
          cd $HOME
          wget --no-verbose https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "PATH=$HOME/gradle-8.7/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Gradle
        run: gradle --version

      - name: Pull assets
        run: |
          mkdir -p app/src/main/assets
          wget --no-verbose -P app/src/main/assets https://storage.googleapis.com/mediapipe-models/pose_landmarker_lite/float16/1/pose_landmarker_lite.task || true
          wget --no-verbose -P app/src/main/assets https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite || true

      # 重点：输出全部日志到 log.txt；就算构建失败也必须 cat 出来！
      - name: Run build & dump log
        id: buildstep
        continue-on-error: true
        run: |
          cd app
          set -o pipefail
          gradle assembleDebug --stacktrace --no-build-cache 2>&1 | tee ../build-log.txt

      - name: FORCE PRINT FULL LOG (关键！这里会吐出被隐藏的真实错误)
        run: cat build-log.txt

      - name: Check if APK exists
        run: ls -la app/build/outputs/apk/debug/ || echo "APK 目录不存在"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success() || steps.buildstep.outcome == 'success'
        with:
          name: ShieldApk
          path: app/build/outputs/apk/debug/app-debug.apk
