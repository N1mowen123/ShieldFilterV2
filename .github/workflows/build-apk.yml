name: Build ShieldFilterV2 NO‑CACHE
on:
  push:
    branches: [ main ]
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # 关闭gradle缓存
          cache: none

      - name: Install Gradle 8.7，关闭全部缓存
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          cache-read-only: false
          cache-disabled: true

      - name: Prepare assets & download models
        run: |
          set +e
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          wget --connect-timeout=15 --tries=2 --no-check-certificate -O pose_landmarker_lite.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          wget --connect-timeout=15 --tries=2 --no-check-certificate -O gender_classifier.tflite "https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite"
          ls -la
          cd -

      - name: Generate wrapper Gradle8.7
        run: |
          cd app
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew --version

      - name: Build APK
        run: cd app && ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldFilterV2_NoCache
          path: app/build/outputs/apk/debug/app-debug.apk
