name: DIAGNOSE_AND_BUILD_STAGED
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7 manually
        run: |
          cd "$HOME"
          wget --no-verbose https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "PATH=$HOME/gradle-8.7/bin:$PATH" >> $GITHUB_ENV

      - name: Check Gradle version
        run: gradle --version

      # 【关键诊断阶段】先跑 projects —— 这一步失败=项目配置就崩，直接输出原因，不往下走
      - name: DIAGNOSE gradle projects (fail fast on config error)
        run: |
          cd app
          gradle projects --no-daemon --stacktrace

      # 配置通过才走到下载资源（现在先不强制下模型，避免阻塞；后面再加）
      - name: Prepare empty assets dir
        run: mkdir -p app/src/main/assets

      # 正式构建
      - name: Run assembleDebug
        run: |
          cd app
          gradle assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: List output dir
        run: ls -R app/build || echo "build folder was NOT created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldV2_BaseApk
          path: app/build/outputs/apk/debug/app-debug.apk
