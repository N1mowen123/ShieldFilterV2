name: DumpConfigError
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.7 manually
        run: |
          cd "$HOME"
          wget --no-verbose https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "PATH=$HOME/gradle-8.7/bin:$PATH" >> $GITHUB_ENV

      - name: Check Gradle version
        run: gradle --version

      - name: DIAGNOSE gradle projects, capture full log
        id: diag
        continue-on-error: true
        run: |
          cd app
          gradle projects --no-daemon --stacktrace 2>&1 > config-log.txt
          cat config-log.txt

      - name: Print diagnostic result
        run: |
          cat app/config-log.txt

      - name: Prepare empty assets dir
        run: mkdir -p app/src/main/assets

      - name: Build only if diagnose passed
        if: steps.diag.outcome == 'success'
        run: |
          cd app
          gradle assembleDebug --no-daemon --no-build-cache --stacktrace

      - name: List build folder
        run: ls -R app/build || echo "build folder not created"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: steps.diag.outcome == 'success'
        with:
          name: ShieldV2_BaseApk
          path: app/build/outputs/apk/debug/app-debug.apk
