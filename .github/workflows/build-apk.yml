name: Build Shield V2 FINAL NO WRAPPER HACK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Manually fetch official Gradle 8.7 (bypass all broken actions)
        run: |
          cd "$HOME"
          wget --no-verbose https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          export PATH="$HOME/gradle-8.7/bin:$PATH"
          echo "PATH=$HOME/gradle-8.7/bin:$PATH" >> "$GITHUB_ENV"
          gradle --version

      - name: Download model assets
        run: |
          mkdir -p app/src/main/assets
          wget --no-verbose -P app/src/main/assets https://storage.googleapis.com/mediapipe-models/pose_landmarker_lite/float16/1/pose_landmarker_lite.task || true
          wget --no-verbose -P app/src/main/assets https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite || true

      # 关键突破：不生成gradlew！直接用全局gradle指定项目构建
      - name: Build directly with Gradle 8.7 (skip wrapper entirely)
        run: |
          export PATH="$HOME/gradle-8.7/bin:$PATH"
          cd app
          gradle assembleDebug --project-dir=. --stacktrace --no-build-cache

      - name: Verify APK exists
        run: ls -la app/build/outputs/apk/debug/ || echo "APK not generated"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldFinalApk
          path: app/build/outputs/apk/debug/app-debug.apk
