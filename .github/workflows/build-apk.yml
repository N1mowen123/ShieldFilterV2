name: Build ShieldFilterV2 LAST TRY
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # 删掉了非法的 cache: none！这里直接不写cache就等于不启用

      # 完全手动从官网下载 Gradle 8.7，不经过任何坏掉的 gradle‑action
      - name: Download Gradle 8.7 manually
        run: |
          cd $HOME
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "PATH=$HOME/gradle-8.7/bin:$PATH" >> $GITHUB_ENV

      - name: Check Gradle version
        run: gradle --version

      - name: Prepare assets & models
        run: |
          set +e
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          wget -q --connect-timeout=15 --tries=2 https://storage.googleapis.com/mediapipe-models/pose_landmarker_lite/float16/1/pose_landmarker_lite.task
          wget -q --connect-timeout=15 --tries=2 https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite

      - name: Generate wrapper
        run: |
          cd app
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew --version

      - name: Build APK
        run: cd app && ./gradlew assembleDebug --stacktrace --no-build-cache

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldFilterV2_APK
          path: app/build/outputs/apk/debug/app-debug.apk
