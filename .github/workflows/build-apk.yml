name: Build ShieldFilterV2 Auto‑Model
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 云端自动下载姿态与分类模型到assets（无需你本地下载）
        run: |
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          wget --no-check-certificate -O pose_landmarker_lite.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" || true
          wget --no-check-certificate -O gender_classifier.tflite "https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite" || true
          ls -la

      - name: 生成 Gradle Wrapper
        run: |
          cd app
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: 编译 Debug APK
        run: cd app && ./gradlew assembleDebug

      - name: 输出安装包
        uses: actions/upload-artifact@v4
        with:
          name: ShieldFilterV2_Final_Package
          path: app/build/outputs/apk/debug/app-debug.apk
