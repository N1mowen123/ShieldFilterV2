name: Build ShieldFilterV2 (Java17 + setup‑java@v5 + debug logs)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17 (use v5, resolve deprecation warning)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make assets folder & auto‑download models (with retry & logging)
        run: |
          set -e
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          echo "=== Download pose landmarker ==="
          wget --connect-timeout=20 --tries=3 --no-check-certificate -O pose_landmarker_lite.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" || echo "WARN: pose download skipped (will run in fallback mode)"
          echo "=== Download gender classifier ==="
          wget --connect-timeout=20 --tries=3 --no-check-certificate -O gender_classifier.tflite "https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite" || echo "WARN: gender model skipped (fallback)"
          ls -la
          cd -

      - name: Ensure gradlew is executable
        run: |
          cd app
          if [ ! -f gradlew ]; then
              echo "gradlew missing, regenerate wrapper"
              gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ls -la

      - name: Run Gradle build (with full stack trace for debug)
        run: cd app && ./gradlew assembleDebug --stacktrace --info

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldFilterV2_Built_APK
          path: app/build/outputs/apk/debug/app-debug.apk
