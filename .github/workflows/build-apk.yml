name: Build ShieldFilterV2 Locked Gradle8.7
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare assets & download models
        run: |
          set +e
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          wget --connect-timeout=15 --tries=2 --no-check-certificate -O pose_landmarker_lite.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          wget --connect-timeout=15 --tries=2 --no-check-certificate -O gender_classifier.tflite "https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite"
          ls -la
          cd -

      - name: Make sure gradlew exists & executable（⚠️不再自动运行 gradle wrapper！！）
        run: |
          cd app
          chmod +x gradlew
          ./gradlew --version

      - name: Assemble Debug
        run: cd app && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldFilterV2_Fixed
          path: app/build/outputs/apk/debug/app-debug.apk
