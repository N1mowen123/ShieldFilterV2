name: Build ShieldFilterV2 DEBUG FULL LOG
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK17 (v5 规避弃用)
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 准备assets、下载模型（失败只警告不终止）
        run: |
          set +e
          mkdir -p app/src/main/assets
          cd app/src/main/assets
          wget --connect-timeout=15 --tries=2 --no-check-certificate -O pose_landmarker_lite.task "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
          wget --connect-timeout=15 --tries=2 --no-check-certificate -O gender_classifier.tflite "https://storage.googleapis.com/download.tensorflow.org/models/tflite/mobilenet_v2_1.0_224_quant.tflite"
          ls -la
          cd -

      - name: 生成/修复 gradlew
        run: |
          cd app
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: 编译（--stacktrace --debug 强制打出完整错误！！）
        run: cd app && ./gradlew assembleDebug --stacktrace --debug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: ShieldFilterV2_APK
          path: app/build/outputs/apk/debug/app-debug.apk
